spring:
  application:
    name: minimarket-backend
  profiles:
    default: dev
  jackson:
    deserialization:
      accept-float-as-int: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:38080/realms/minimarket}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:38080/realms/minimarket/protocol/openid-connect/certs}
minimarket:
  apisperu:
    token: ${APISPERU_TOKEN:}
  keycloak-admin:
    url: ${KEYCLOAK_ADMIN_URL:http://localhost:38080}
    realm: ${KEYCLOAK_ADMIN_REALM:minimarket}
    client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:minimarket-backend}
    client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:minimarket-backend-secret-2026}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  port: ${SERVER_PORT:8080}
